# Fail2Ban filter for the Emby addons API/CORS proxy (nginx).
#
# Matches the real 401 (no valid Emby session, auth_request), 403 (client
# not coming from the Emby web / target host not allow-listed), 405 (method)
# and 429 (rate limit) that
# snippets/emby-api-common.conf and snippets/emby-cors-proxy.conf return,
# as logged in emby_api_access.log / emby_cors_access.log with the
# 'emby_cache' log_format:
#   <ip> - - [time] "GET /api-proxy/... HTTP/1.1" 403 146 "-" "ua" "-" cache_status=-
#
# Two lines because the log_format records $uri, which nginx has already
# rewritten by the time some answers are produced:
#   1. 401/403/405 (and the CORS proxy's answers) keep the original
#      /api-proxy/... or /cors-proxy/... path.
#   2. The API proxy's 429 (limit_req, which runs after the
#      'rewrite ^/api-proxy/<provider>/' of emby-api-common.conf) is logged
#      with the upstream path ("GET /3/configuration ..."). Both logs only
#      ever hold proxy traffic, so any 429 in them counts -- but only when
#      cache_status=- (nginx answered without contacting the upstream).
#      A 429 passed through from a third-party API (its own quota) has a
#      cache status and must not ban the browser that happened to ask.
# Upstream 401s (a wrong third-party key) are likewise logged with the
# rewritten path and are deliberately not matched.
#
# Test:  fail2ban-regex /var/log/nginx/emby_api_access.log /etc/fail2ban/filter.d/emby-api-proxy.conf

[Definition]
# nginx combined-style prefix: <ip> - <remote_user or -> [time]
failregex = ^<HOST> - \S+ \[[^\]]*\] "(?:GET|POST|HEAD|PUT|DELETE|OPTIONS|PATCH) /(?:api-proxy|cors-proxy)/[^" ]* HTTP/\d\.\d" (?:401|403|405|429)
            ^<HOST> - \S+ \[[^\]]*\] "(?:GET|POST|HEAD|PUT|DELETE|OPTIONS|PATCH) /[^" ]* HTTP/\d\.\d" 429 .* cache_status=-(?:\s|$)
ignoreregex =
