# Fail2Ban jail for [emby-api-proxy]: bans IPs that keep hitting the addons'
# API/CORS proxy without coming from the Emby web (403), with the wrong
# method (405) or past the per-IP rate limit (429).
#
# Companion of the [emby-admin-probe] jail (same idea, nginx-side perimeter
# rejections) -- Emby's own app-level auth failures are handled by [emby].
#
# maxretry=10 / findtime=10m: a legitimate browser never trips this (the
# proxy is only called from Emby's own pages, and 429 needs a sustained
# burst), while a scraper trying to use the proxy as a free API is banned
# within seconds.

[emby-api-proxy]
enabled  = true
filter   = emby-api-proxy
logpath  = /var/log/nginx/emby_api_access.log
           /var/log/nginx/emby_cors_access.log
port     = 80,443
maxretry = 10
findtime = 10m
bantime  = 1h
action_  = %(default/action_)s[name=%(__name__)s-tcp, protocol="tcp"]
