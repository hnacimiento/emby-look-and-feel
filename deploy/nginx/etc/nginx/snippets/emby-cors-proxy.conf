# ============================================================
# CORS proxy for the Emby addons (Spotlight.js, emby-ratings.js,
# emby-elsewhere.js) -- snippet to include INSIDE the HTTPS server {}
# of the Emby vhost:
#
#     include snippets/emby-cors-proxy.conf;
#
# The addons build the URL by concatenating CORS_PROXY_URL + the full URL
# of the destination site (unencoded), e.g.:
#
#     CORS_PROXY_URL = 'https://emby.example.com/cors-proxy/'
#     -> https://emby.example.com/cors-proxy/https://www.rottentomatoes.com/m/inception
#
# They use it only for the Rotten Tomatoes / AlloCiné scraping fallback
# and the "where to watch" deep-links from TMDB (sites without CORS). It is NOT
# the API keys mechanism (TMDB/MDBList/Kinopoisk travel separately).
#
# Security: it is NOT an open proxy. It only forwards to the whitelist of
# hosts below; any other destination returns 403. Only GET/HEAD (and
# OPTIONS for the CORS preflight). Client cookies or Authorization are not
# forwarded, and the destination site's cookies/CSP are dropped.
#
# Dependencies of the including server {}: 'resolver' defined (this
# vhost already has it) -- proxy_pass with variables needs it to resolve
# the destination hosts at runtime.
# ============================================================

# ':/+' instead of '://' because nginx normalizes double slashes in $uri
# (merge_slashes on, default): 'https://' arrives as 'https:/'. Both forms
# are accepted without touching merge_slashes at server level.
location ~ ^/cors-proxy/(?<cors_scheme>https?):/+(?<cors_host>[^/?]+)(?<cors_path>/[^?]*)?$ {

    # Whitelist of destinations (the only ones the addons use).
    if ($cors_host !~* ^(www\.)?(rottentomatoes\.com|allocine\.fr|themoviedb\.org)$) {
        return 403;
    }

    # CORS preflight (in case Emby is opened from another origin, e.g. the
    # direct IP, and the browser asks before the real request).
    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Accept, Accept-Language, Content-Type, Range" always;
        add_header Access-Control-Max-Age 86400 always;
        return 204;
    }

    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # Empty path ("https://host") -> "/"
    set $cors_target_path $cors_path;
    if ($cors_target_path = "") {
        set $cors_target_path "/";
    }

    # DNS resolution specific to this location, short timeout. Which DNS
    # servers work depends on each network (hard-coded public resolvers time
    # out -- "could not be resolved (110)" -> 502 -- where only the network's
    # own DNS is allowed), so the resolver line lives in
    # snippets/emby-resolver.conf (per site, not versioned; template:
    # emby-resolver.conf.example).
    include snippets/emby-resolver.conf;
    resolver_timeout 3s;

    proxy_pass $cors_scheme://$cors_host$cors_target_path$is_args$args;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_name $cors_host;
    proxy_ssl_protocols TLSv1.2 TLSv1.3;

    # Towards the destination: look like a normal browser and do not leak anything
    # from the Emby client.
    proxy_set_header Host $cors_host;
    proxy_set_header Connection "";
    proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36";
    proxy_set_header Accept "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8";
    proxy_set_header Accept-Language "en-US,en;q=0.9,es;q=0.8";
    proxy_set_header Accept-Encoding "";
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_set_header Referer "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Real-IP "";

    # The destination sites sometimes redirect (TMDB adds the canonical slug
    # with a 301 to a RELATIVE path, RT/AlloCiné sometimes http->https).
    # Without rewriting Location, the browser would follow the redirect against
    # this same vhost (relative path -> falls into Emby) or against the destination
    # site (absolute -> without CORS). Both forms are rewritten so
    # the hop goes back through the proxy (and through the whitelist).
    proxy_redirect ~^/(.*)$ /cors-proxy/$cors_scheme://$cors_host/$1;
    proxy_redirect ~^(https?://.*)$ /cors-proxy/$1;
    proxy_intercept_errors off;

    # From the destination towards the client: remove what makes no sense behind
    # a proxy (cookies, CSP/frame of the original site) and add CORS.
    proxy_hide_header Set-Cookie;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Content-Security-Policy-Report-Only;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header Access-Control-Allow-Origin;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Expose-Headers "Content-Type, Content-Length" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "public, max-age=600" always;

    # Disk cache: ratings pages change little, and this avoids hitting
    # the destination site on every opening of the same movie. With
    # use_stale updating + background_update, an expired entry is served
    # instantly and refreshed in the background (nobody waits for the scraping).
    proxy_cache disk_cache;
    proxy_cache_key "cors|$cors_scheme|$cors_host|$cors_target_path|$args";
    proxy_cache_methods GET HEAD;
    proxy_cache_valid 200 24h;
    proxy_cache_valid 301 302 1h;
    proxy_cache_valid 404 10m;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_background_update on;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 10s;
    proxy_ignore_headers Set-Cookie Cache-Control Expires;
    add_header X-Cors-Cache $upstream_cache_status always;

    proxy_connect_timeout 10s;
    proxy_read_timeout 20s;
    proxy_send_timeout 20s;
    proxy_buffering on;
    proxy_max_temp_file_size 8m;
    client_max_body_size 0;

    access_log /var/log/nginx/emby_cors_access.log emby_cache buffer=32k flush=5s;
    error_log /var/log/nginx/emby_error.log warn;
}
