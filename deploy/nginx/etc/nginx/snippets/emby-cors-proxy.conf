# ============================================================
# CORS proxy para los addons de Emby (Spotlight.js, emby-ratings.js,
# emby-elsewhere.js) -- snippet para incluir DENTRO del server {} HTTPS
# del vhost de Emby:
#
#     include snippets/emby-cors-proxy.conf;
#
# Los addons arman la URL concatenando CORS_PROXY_URL + la URL completa
# del sitio destino (sin codificar), p. ej.:
#
#     CORS_PROXY_URL = 'https://emby.example.com/cors-proxy/'
#     -> https://emby.example.com/cors-proxy/https://www.rottentomatoes.com/m/inception
#
# Lo usan solo para el fallback de scraping de Rotten Tomatoes / AlloCiné
# y los deep-links de "dónde ver" de TMDB (sitios sin CORS). NO es el
# mecanismo de las API keys (TMDB/MDBList/Kinopoisk viajan aparte).
#
# Seguridad: NO es un proxy abierto. Solo se reenvía a la lista blanca de
# hosts de abajo; cualquier otro destino devuelve 403. Solo GET/HEAD (y
# OPTIONS para el preflight CORS). No se reenvían cookies ni Authorization
# del cliente, y se descartan las cookies/CSP del sitio destino.
#
# Dependencias del server {} que lo incluye: 'resolver' definido (este
# vhost ya lo tiene) -- proxy_pass con variables lo necesita para resolver
# los hosts destino en tiempo de ejecución.
# ============================================================

# ':/+' en vez de '://' porque nginx normaliza barras dobles en $uri
# (merge_slashes on, default): 'https://' llega como 'https:/'. Se aceptan
# ambas formas sin tocar merge_slashes a nivel server.
location ~ ^/cors-proxy/(?<cors_scheme>https?):/+(?<cors_host>[^/?]+)(?<cors_path>/[^?]*)?$ {

    # Lista blanca de destinos (los únicos que usan los addons).
    if ($cors_host !~* ^(www\.)?(rottentomatoes\.com|allocine\.fr|themoviedb\.org)$) {
        return 403;
    }

    # Preflight CORS (por si Emby se abre desde otro origen, p. ej. la IP
    # directa, y el navegador pregunta antes de la petición real).
    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Accept, Accept-Language, Content-Type, Range" always;
        add_header Access-Control-Max-Age 86400 always;
        return 204;
    }

    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # Ruta vacía ("https://host") -> "/"
    set $cors_target_path $cors_path;
    if ($cors_target_path = "") {
        set $cors_target_path "/";
    }

    # Resolución DNS propia de esta location: los destinos son hosts
    # públicos, y con el 'resolver' del server (LAN DNS primero) se vieron
    # timeouts intermitentes ("could not be resolved (110: Operation timed
    # out)") que terminaban en 502. Resolvers públicos, timeout corto.
    resolver 1.1.1.1 9.9.9.9 8.8.8.8 valid=300s ipv6=off;
    resolver_timeout 3s;

    proxy_pass $cors_scheme://$cors_host$cors_target_path$is_args$args;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_name $cors_host;
    proxy_ssl_protocols TLSv1.2 TLSv1.3;

    # Hacia el destino: parecer un navegador normal y no filtrar nada del
    # cliente de Emby.
    proxy_set_header Host $cors_host;
    proxy_set_header Connection "";
    proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36";
    proxy_set_header Accept "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8";
    proxy_set_header Accept-Language "en-US,en;q=0.9,es;q=0.8";
    proxy_set_header Accept-Encoding "";
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_set_header Referer "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Real-IP "";

    # Los sitios destino redirigen a veces (TMDB agrega el slug canónico
    # con un 301 a una ruta RELATIVA, RT/AlloCiné a veces http->https).
    # Sin reescribir Location, el navegador seguiría el redirect contra
    # este mismo vhost (ruta relativa -> cae en Emby) o contra el sitio
    # destino (absoluta -> sin CORS). Se reescriben ambas formas para que
    # el salto vuelva a pasar por el proxy (y por la lista blanca).
    proxy_redirect ~^/(.*)$ /cors-proxy/$cors_scheme://$cors_host/$1;
    proxy_redirect ~^(https?://.*)$ /cors-proxy/$1;
    proxy_intercept_errors off;

    # Del destino hacia el cliente: quitar lo que no tiene sentido detrás
    # de un proxy (cookies, CSP/frame del sitio original) y agregar CORS.
    proxy_hide_header Set-Cookie;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Content-Security-Policy-Report-Only;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header Access-Control-Allow-Origin;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Expose-Headers "Content-Type, Content-Length" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "public, max-age=600" always;

    # Caché en disco: las páginas de ratings cambian poco, y evita pegarle
    # al sitio destino en cada apertura de la misma película. Con
    # use_stale updating + background_update, una entrada vencida se sirve
    # al instante y se refresca en segundo plano (nadie espera al scraping).
    proxy_cache disk_cache;
    proxy_cache_key "cors|$cors_scheme|$cors_host|$cors_target_path|$args";
    proxy_cache_methods GET HEAD;
    proxy_cache_valid 200 24h;
    proxy_cache_valid 301 302 1h;
    proxy_cache_valid 404 10m;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_background_update on;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 10s;
    proxy_ignore_headers Set-Cookie Cache-Control Expires;
    add_header X-Cors-Cache $upstream_cache_status always;

    proxy_connect_timeout 10s;
    proxy_read_timeout 20s;
    proxy_send_timeout 20s;
    proxy_buffering on;
    proxy_max_temp_file_size 8m;
    client_max_body_size 0;

    access_log /var/log/nginx/emby_cors_access.log emby_cache buffer=32k flush=5s;
    error_log /var/log/nginx/emby_error.log warn;
}
