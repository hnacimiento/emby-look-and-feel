# snippets/emby-scan-block.conf  (server context)
#
# Native nginx blocking of vulnerability-scan paths (WordPress/PHP/secret
# probes) on the Emby vhost. This is a plain regex `location` that drops the
# connection with 444 -- NO WAF engine is placed in the request path, so it
# CANNOT stall WebSocket (/embywebsocket) or HTTP/2 video streaming the way the
# experimental Coraza connector did (see docs/SECURITY-LAYERS.md, layer 11b).
#
# Regex locations take precedence over the prefix `location /` dispatch, so
# these URIs are dropped before reaching the Emby app. No legitimate Emby or
# web-client path matches these tokens (same patterns validated as a fail2ban
# filter: 642 hits / 0 false positives). The 444 is still logged to
# emby_access.log, so the fail2ban `emby-web-scan` jail keeps banning repeat
# offenders at the firewall.
#
# Included once from the Emby `server {}` block, next to the other snippet
# includes. Return 444 (drop, no response) gives scanners nothing.
location ~* "^/(?:_emby_root_[a-z_]+/)?(?:wp[-/]|wp-json|wordpress/|blog/|cms/|xmlrpc\.php|wp-login|wp-admin|wp-content|wp-includes|\.env\b|\.git/|phpmyadmin|pma/|vendor/)" {
    access_log /var/log/nginx/emby_access.log emby_timing;
    return 444;
}
