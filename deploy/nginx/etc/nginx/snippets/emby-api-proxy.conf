# ============================================================
# API proxy with shared cache for the Emby addons -- SERVER context
# part. Include inside the HTTPS server {} of the Emby vhost:
#
#     include snippets/emby-api-proxy.conf;
#
# Requires /etc/nginx/conf.d/emby-api-cache.conf (cache zone, maps,
# limit_req, keys). The locations are 'location ^~' (prefix with
# priority): they beat any 'location ~' regex of the vhost regardless of
# order, so the include can go anywhere in the server {}.
#
# What it does: the installer rewrites the addon bases
#     https://api.mdblist.com/          -> https://<vhost>/api-proxy/mdblist/
#     https://api.themoviedb.org/       -> https://<vhost>/api-proxy/tmdb/
#     https://kinopoiskapiunofficial.tech/ -> https://<vhost>/api-proxy/kinopoisk/
#     https://www.omdbapi.com/          -> https://<vhost>/api-proxy/omdb/
# and injects a placeholder instead of the API key. Here the placeholder
# is removed, the real key is added (query param for TMDB/MDBList/OMDb,
# X-API-KEY header for Kinopoisk) and the response is cached for ALL
# users and devices. The browser never sees the keys.
#
# Only GET/HEAD (+ OPTIONS for preflight). Only from the Emby web
# (map $emby_api_client_ok). Rate limit per IP. One fixed destination per
# location: it is not an open proxy.
# ============================================================

# --- Session validation for the provider locations below ---------------
# auth_request sends a subrequest here before proxying to the API. It passes
# (2xx) if:
#   - the client comes from the LAN by source IP ($emby_lan_client, geo from
#     emby-tuning.conf): Emby opened by IP does not have the domain cookie
#     (it is cross-site) and is already inside the home network; or
#   - the emby_proxy_token cookie (reflection of the web's X-Emby-Token, see
#     conf.d/emby-api-cache.conf) is a token that Emby accepts: it asks
#     GET /emby/System/Info (an authenticated endpoint, stable since Emby 3.x)
#     with that token; 200 = valid session, 401 = no. Logging out or deleting
#     the device in Emby invalidates the token and therefore the access.
# The result is cached 5 min per token so Emby is not queried on every
# badge. Without the auth_request module nginx does not start: it was compiled with
# --with-http_auth_request_module on purpose.
location = /_emby_auth {
    internal;
    if ($emby_lan_client) {
        return 204;
    }
    if ($cookie_emby_proxy_token = "") {
        return 401;
    }
    proxy_pass http://emby_backend/emby/System/Info;
    proxy_http_version 1.1;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Emby-Token $cookie_emby_proxy_token;
    proxy_set_header Cookie "";
    proxy_cache emby_api_cache;
    proxy_cache_key "auth|$cookie_emby_proxy_token";
    proxy_cache_valid 200 5m;
    proxy_cache_valid 401 403 1m;
    proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
}

# --- MDBList: aggregated ratings (IMDb/RT/Metacritic/Trakt/Letterboxd...) ---
location ^~ /api-proxy/mdblist/ {
    set $emby_api_provider   "mdblist";
    set $emby_api_upstream   "https://api.mdblist.com";
    set $emby_api_query      "apikey=${emby_mdblist_api_key}&${emby_api_args_nokey}";
    set $emby_api_key_header "";
    include snippets/emby-api-common.conf;
    proxy_cache_valid 200 24h;
    proxy_cache_valid 404 1h;
}

# --- TMDB: seasons/episodes (emby-ratings), watch/providers (elsewhere),
#     reviews (Reviews.js) ----------------------------------------------------
location ^~ /api-proxy/tmdb/ {
    set $emby_api_provider   "tmdb";
    set $emby_api_upstream   "https://api.themoviedb.org";
    set $emby_api_query      "api_key=${emby_tmdb_api_key}&${emby_api_args_nokey}";
    set $emby_api_key_header "";
    include snippets/emby-api-common.conf;
    proxy_cache_valid 200 24h;
    proxy_cache_valid 404 1h;
}

# --- Kinopoisk (unofficial): search by title+year, key by header -------
location ^~ /api-proxy/kinopoisk/ {
    set $emby_api_provider   "kinopoisk";
    set $emby_api_upstream   "https://kinopoiskapiunofficial.tech";
    set $emby_api_query      $args;
    set $emby_api_key_header $emby_kinopoisk_api_key;
    include snippets/emby-api-common.conf;
    proxy_cache_valid 200 7d;
    proxy_cache_valid 404 1h;
}

# --- OMDb: Oscar/Emmy awards (emby-ratings.js, since its 2026-09-30
#     version). Free keys allow 1,000 calls/day: the long shared cache keeps
#     a whole library well under that. OMDb answers 401 when the key is
#     wrong or the daily limit is reached; that is cached briefly so a
#     spent quota is not hammered once per title view. Without a key in
#     snippets/emby-api-keys.conf the location answers 503 without
#     calling OMDb (the installer only enables awards when a key exists).
location ^~ /api-proxy/omdb/ {
    if ($emby_omdb_api_key = "") {
        return 503;
    }
    set $emby_api_provider   "omdb";
    set $emby_api_upstream   "https://www.omdbapi.com";
    set $emby_api_query      "apikey=${emby_omdb_api_key}&${emby_api_args_nokey}";
    set $emby_api_key_header "";
    include snippets/emby-api-common.conf;
    proxy_cache_valid 200 7d;
    proxy_cache_valid 401 10m;
}
