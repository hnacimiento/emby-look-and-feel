# ============================================================
# API proxy con caché compartida para los addons de Emby -- parte de
# contexto SERVER. Incluir dentro del server {} HTTPS del vhost de Emby:
#
#     include snippets/emby-api-proxy.conf;
#
# Requiere /etc/nginx/conf.d/emby-api-cache.conf (zona de caché, maps,
# limit_req, keys). Las locations son 'location ^~' (prefijo con
# prioridad): ganan a cualquier 'location ~' regex del vhost sin importar
# el orden, así que el include puede ir en cualquier parte del server {}.
#
# Qué hace: el instalador reescribe en los addons las bases
#     https://api.mdblist.com/          -> https://<vhost>/api-proxy/mdblist/
#     https://api.themoviedb.org/       -> https://<vhost>/api-proxy/tmdb/
#     https://kinopoiskapiunofficial.tech/ -> https://<vhost>/api-proxy/kinopoisk/
# y les inyecta un placeholder en vez de la API key. Acá se quita el
# placeholder, se agrega la key real (query param para TMDB/MDBList,
# header X-API-KEY para Kinopoisk) y se cachea la respuesta para TODOS
# los usuarios y dispositivos. El navegador nunca ve las keys.
#
# Solo GET/HEAD (+ OPTIONS para preflight). Solo desde la web de Emby
# (map $emby_api_client_ok). Rate limit por IP. Un destino fijo por
# location: no es un proxy abierto.
# ============================================================

# --- Validación de sesión para las tres locations de abajo -----------------
# auth_request manda una subpetición acá antes de proxyar a la API. Pasa
# (2xx) si:
#   - el cliente viene de la LAN por IP de origen ($emby_lan_client, geo de
#     emby-tuning.conf): Emby abierto por IP no tiene la cookie del dominio
#     (es cross-site) y ya está dentro de casa; o
#   - la cookie emby_proxy_token (reflejo del X-Emby-Token de la web, ver
#     conf.d/emby-api-cache.conf) es un token que Emby acepta: se pregunta
#     GET /emby/System/Info (endpoint autenticado, estable desde Emby 3.x)
#     con ese token; 200 = sesión válida, 401 = no. Cerrar sesión o borrar
#     el dispositivo en Emby invalida el token y por lo tanto el acceso.
# El resultado se cachea 5 min por token para no consultar a Emby en cada
# badge. Sin módulo auth_request nginx no arranca: fue compilado con
# --with-http_auth_request_module a propósito.
location = /_emby_auth {
    internal;
    if ($emby_lan_client) {
        return 204;
    }
    if ($cookie_emby_proxy_token = "") {
        return 401;
    }
    proxy_pass http://emby_backend/emby/System/Info;
    proxy_http_version 1.1;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Emby-Token $cookie_emby_proxy_token;
    proxy_set_header Cookie "";
    proxy_cache emby_api_cache;
    proxy_cache_key "auth|$cookie_emby_proxy_token";
    proxy_cache_valid 200 5m;
    proxy_cache_valid 401 403 1m;
    proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
}

# --- MDBList: ratings agregados (IMDb/RT/Metacritic/Trakt/Letterboxd...) ---
location ^~ /api-proxy/mdblist/ {
    set $emby_api_provider   "mdblist";
    set $emby_api_upstream   "https://api.mdblist.com";
    set $emby_api_query      "apikey=${emby_mdblist_api_key}&${emby_api_args_nokey}";
    set $emby_api_key_header "";
    include snippets/emby-api-common.conf;
    proxy_cache_valid 200 24h;
    proxy_cache_valid 404 1h;
}

# --- TMDB: temporadas/episodios (emby-ratings), watch/providers (elsewhere),
#     reviews (Reviews.js) ----------------------------------------------------
location ^~ /api-proxy/tmdb/ {
    set $emby_api_provider   "tmdb";
    set $emby_api_upstream   "https://api.themoviedb.org";
    set $emby_api_query      "api_key=${emby_tmdb_api_key}&${emby_api_args_nokey}";
    set $emby_api_key_header "";
    include snippets/emby-api-common.conf;
    proxy_cache_valid 200 24h;
    proxy_cache_valid 404 1h;
}

# --- Kinopoisk (no oficial): búsqueda por título+año, key por header -------
location ^~ /api-proxy/kinopoisk/ {
    set $emby_api_provider   "kinopoisk";
    set $emby_api_upstream   "https://kinopoiskapiunofficial.tech";
    set $emby_api_query      $args;
    set $emby_api_key_header $emby_kinopoisk_api_key;
    include snippets/emby-api-common.conf;
    proxy_cache_valid 200 7d;
    proxy_cache_valid 404 1h;
}
