# ============================================================
# Common body of the provider locations in snippets/emby-api-proxy.conf.
# Included INSIDE each location; expects these variables already set:
#   $emby_api_provider    -- short name (for the cache key and logs)
#   $emby_api_upstream    -- "https://host" destination, no trailing slash
#   $emby_api_query       -- query string already with the real key (or $args)
#   $emby_api_key_header  -- value for X-API-KEY ("" = send nothing)
# ============================================================

# Only from the Emby web (see map in emby-api-cache.conf).
if ($emby_api_client_ok = 0) {
    return 403;
}

# CORS preflight: needed when Emby is opened by its direct IP and the
# browser asks before sending the X-API-KEY header (Kinopoisk).
if ($request_method = OPTIONS) {
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Accept, Accept-Language, Content-Type, X-API-KEY" always;
    add_header Access-Control-Max-Age 86400 always;
    return 204;
}

if ($request_method !~ ^(GET|HEAD)$) {
    return 405;
}

limit_req zone=emby_api_zone burst=20 nodelay;
limit_req_status 429;

# Real authentication: the Emby session (cookie emby_proxy_token) validated
# against Emby, or the source IP on the LAN. See location /_emby_auth in
# snippets/emby-api-proxy.conf. A 401 here means "no valid Emby session"
# (counts for the fail2ban jail just like the 403 from the origin).
# Kill switch: comment out this line and reload to leave only the
# Referer/Origin check above.
auth_request /_emby_auth;

# /api-proxy/<provider>/<real path> -> /<real path>
rewrite ^/api-proxy/[a-z]+/(.*)$ /$1 break;

# Resolver: which DNS servers can resolve the API hosts depends on each
# network (hard-coded public resolvers time out -- "could not be resolved
# (110)" -> 502 -- where the network only allows its own DNS), so the
# resolver line lives in snippets/emby-resolver.conf (per site, not
# versioned; template: emby-resolver.conf.example).
include snippets/emby-resolver.conf;
resolver_timeout 3s;

proxy_pass $emby_api_upstream$uri?$emby_api_query;
proxy_http_version 1.1;
proxy_ssl_server_name on;
proxy_ssl_protocols TLSv1.2 TLSv1.3;

# Towards the destination: nothing from the Emby client, and no compression so
# the cached response is plaintext (the vhost already compresses towards the client).
proxy_set_header Host $proxy_host;
proxy_set_header Connection "";
proxy_set_header Accept "application/json";
proxy_set_header Accept-Encoding "";
proxy_set_header User-Agent "emby-addons-proxy/1.0";
proxy_set_header X-API-KEY $emby_api_key_header;
proxy_set_header Cookie "";
proxy_set_header Authorization "";
proxy_set_header Referer "";
proxy_set_header Origin "";
proxy_set_header X-Forwarded-For "";
proxy_set_header X-Real-IP "";

# Shared cache. The key does NOT include the key (it is no longer in
# $emby_api_args_nokey) nor the real provider of the key, so all
# users share the same entry. The APIs send no-store/Vary: they are
# ignored on purpose (ratings change little; TTL per location).
proxy_cache emby_api_cache;
proxy_cache_key "$emby_api_provider|$uri|$emby_api_args_nokey";
proxy_cache_methods GET HEAD;
proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
proxy_cache_background_update on;
proxy_cache_lock on;
proxy_cache_lock_timeout 5s;
proxy_cache_revalidate on;

# From the destination towards the client: no cookies, none of its CORS
# headers (our own are set) and no security headers from ANOTHER site.
proxy_hide_header Set-Cookie;
proxy_hide_header Access-Control-Allow-Origin;
proxy_hide_header Access-Control-Allow-Headers;
proxy_hide_header Access-Control-Allow-Methods;
proxy_hide_header Content-Security-Policy;
proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Frame-Options;
add_header Access-Control-Allow-Origin "*" always;
add_header Access-Control-Expose-Headers "Content-Type, Content-Length, X-Api-Cache" always;
add_header X-Api-Cache $upstream_cache_status always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Cache-Control "public, max-age=3600" always;

proxy_connect_timeout 10s;
proxy_read_timeout 20s;
proxy_send_timeout 20s;
proxy_buffering on;
proxy_max_temp_file_size 2m;

access_log /var/log/nginx/emby_api_access.log emby_cache buffer=32k flush=5s;
error_log /var/log/nginx/emby_error.log warn;
