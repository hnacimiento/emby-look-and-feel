# ============================================================
# Cuerpo común de las tres locations de snippets/emby-api-proxy.conf.
# Se incluye DENTRO de cada location; espera estas variables ya seteadas:
#   $emby_api_provider    -- nombre corto (para la clave de caché y logs)
#   $emby_api_upstream    -- "https://host" destino, sin barra final
#   $emby_api_query       -- query string ya con la key real (o $args)
#   $emby_api_key_header  -- valor para X-API-KEY ("" = no mandar nada)
# ============================================================

# Solo desde la web de Emby (ver map en emby-api-cache.conf).
if ($emby_api_client_ok = 0) {
    return 403;
}

# Preflight CORS: hace falta cuando Emby se abre por la IP directa y el
# navegador pregunta antes de mandar el header X-API-KEY (Kinopoisk).
if ($request_method = OPTIONS) {
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Accept, Accept-Language, Content-Type, X-API-KEY" always;
    add_header Access-Control-Max-Age 86400 always;
    return 204;
}

if ($request_method !~ ^(GET|HEAD)$) {
    return 405;
}

limit_req zone=emby_api_zone burst=20 nodelay;
limit_req_status 429;

# Autenticación real: la sesión de Emby (cookie emby_proxy_token) validada
# contra Emby, o IP de origen en la LAN. Ver location /_emby_auth en
# snippets/emby-api-proxy.conf. Un 401 acá significa "sin sesión de Emby
# válida" (cuenta para la jail de fail2ban igual que el 403 del origen).
# Kill switch: comentar esta línea y recargar deja solo el chequeo de
# Referer/Origin de arriba.
auth_request /_emby_auth;

# /api-proxy/<proveedor>/<ruta real> -> /<ruta real>
rewrite ^/api-proxy/[a-z]+/(.*)$ /$1 break;

# Resolvers públicos (destinos públicos; el LAN DNS del server dio
# timeouts intermitentes, ver emby-cors-proxy.conf).
resolver 1.1.1.1 9.9.9.9 8.8.8.8 valid=300s ipv6=off;
resolver_timeout 3s;

proxy_pass $emby_api_upstream$uri?$emby_api_query;
proxy_http_version 1.1;
proxy_ssl_server_name on;
proxy_ssl_protocols TLSv1.2 TLSv1.3;

# Hacia el destino: nada del cliente de Emby, y sin compresión para que la
# respuesta cacheada sea texto plano (el vhost ya comprime hacia el cliente).
proxy_set_header Host $proxy_host;
proxy_set_header Connection "";
proxy_set_header Accept "application/json";
proxy_set_header Accept-Encoding "";
proxy_set_header User-Agent "emby-addons-proxy/1.0";
proxy_set_header X-API-KEY $emby_api_key_header;
proxy_set_header Cookie "";
proxy_set_header Authorization "";
proxy_set_header Referer "";
proxy_set_header Origin "";
proxy_set_header X-Forwarded-For "";
proxy_set_header X-Real-IP "";

# Caché compartida. La clave NO incluye la key (ya no está en
# $emby_api_args_nokey) ni el proveedor real de la key, así todos los
# usuarios comparten la misma entrada. Las APIs mandan no-store/Vary: se
# ignoran a propósito (los ratings cambian poco; TTL por location).
proxy_cache emby_api_cache;
proxy_cache_key "$emby_api_provider|$uri|$emby_api_args_nokey";
proxy_cache_methods GET HEAD;
proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
proxy_cache_background_update on;
proxy_cache_lock on;
proxy_cache_lock_timeout 5s;
proxy_cache_revalidate on;

# Del destino hacia el cliente: sin cookies, sin sus headers CORS (se
# ponen los propios) y sin cabeceras de seguridad de OTRO sitio.
proxy_hide_header Set-Cookie;
proxy_hide_header Access-Control-Allow-Origin;
proxy_hide_header Access-Control-Allow-Headers;
proxy_hide_header Access-Control-Allow-Methods;
proxy_hide_header Content-Security-Policy;
proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Frame-Options;
add_header Access-Control-Allow-Origin "*" always;
add_header Access-Control-Expose-Headers "Content-Type, Content-Length, X-Api-Cache" always;
add_header X-Api-Cache $upstream_cache_status always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Cache-Control "public, max-age=3600" always;

proxy_connect_timeout 10s;
proxy_read_timeout 20s;
proxy_send_timeout 20s;
proxy_buffering on;
proxy_max_temp_file_size 2m;

access_log /var/log/nginx/emby_api_access.log emby_cache buffer=32k flush=5s;
error_log /var/log/nginx/emby_error.log warn;
