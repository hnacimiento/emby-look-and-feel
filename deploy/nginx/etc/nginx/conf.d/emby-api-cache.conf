# ============================================================
# API proxy para los addons de Emby -- parte de contexto HTTP.
# Va en /etc/nginx/conf.d/emby-api-cache.conf (conf.d/*.conf se incluye
# dentro de http {} desde nginx.conf, así que NO hay que tocar nginx.conf).
#
# Define lo que solo puede vivir en contexto http: la zona de caché
# propia, los maps que limpian la key del query string, el map de
# Referer/Origin permitidos y la zona de limit_req. Las locations están
# en snippets/emby-api-proxy.conf (contexto server); las keys reales en
# snippets/emby-api-keys.conf (chmod 600, ver emby-api-keys.conf.example).
# ============================================================

# Caché propia (no mezclar con ram_cache/disk_cache de Emby): respuestas
# JSON chicas, muchas entradas, vida larga. inactive=30d: una entrada que
# nadie pide en 30 días se descarta aunque su TTL fuera menor.
proxy_cache_path /var/cache/nginx/emby_api levels=1:2 keys_zone=emby_api_cache:16m
                 max_size=512m inactive=30d use_temp_path=off;

# Los addons siguen mandando '?api_key=<placeholder>' (TMDB) o
# '?apikey=<placeholder>' (MDBList) porque su código no se toca; acá se
# quita ese parámetro del query string y la location agrega la key real.
# Casos: solo la key -> ""; 'a=1&api_key=x' -> 'a=1'; 'api_key=x&a=1' -> '&a=1'
# (el '&' inicial sobrante es inofensivo en un query string).
map $args $emby_api_args_nokey {
    default $args;
    "~^(?<pre>.*?)(?:^|&)(?:api_key|apikey)=[^&]*(?<post>.*)$" "$pre$post";
}

# Solo se atienden pedidos que vengan de la web de Emby. Sin nada
# hardcodeado del vhost: el "mismo origen" se deduce del propio server {}
# que recibe el pedido ($scheme://$host, o sea el server_name de
# emby.conf -- si cambia el dominio, esto sigue andando solo), y el acceso
# directo por LAN se admite para cualquier origen http en rangos privados
# RFC1918 (la IP:puerto del upstream de emby.conf entra ahí sin repetirla).
#
# Cómo funciona: la clave del map es "origen-del-pedido|origen-del-vhost"
# y la retrorreferencia \1 de PCRE exige que sean idénticos. Referer llega
# completo en same-origin y solo como origen en cross-origin (por la
# Referrer-Policy del vhost); Origin llega solo en cross-origin.
#
# Es una barrera contra uso casual del proxy como "API gratis con tu key",
# no una autenticación fuerte (ambos headers son falsificables): la
# protección real es el limit_req de abajo y el destino fijo de cada
# location.
map "$http_referer|$scheme://$host" $emby_api_referer_ok {
    default 0;
    "~^(https?://[^/|]+)(/[^|]*)?\|\1$" 1;
}
map "$http_origin|$scheme://$host" $emby_api_origin_ok {
    default 0;
    "~^(https?://[^/|]+)\|\1$" 1;
}
map "$http_origin|$http_referer" $emby_api_lan_ok {
    default 0;
    "~^http://(10\.|172\.(1[6-9]|2[0-9]|3[01])\.|192\.168\.)[0-9.]+(:[0-9]+)?(/|\||$)" 1;
    "~^[^|]*\|http://(10\.|172\.(1[6-9]|2[0-9]|3[01])\.|192\.168\.)[0-9.]+(:[0-9]+)?/" 1;
}
map "$emby_api_referer_ok$emby_api_origin_ok$emby_api_lan_ok" $emby_api_client_ok {
    default 1;
    "000"   0;
}

# Por IP cliente: suficiente para navegar (cada título = 2-4 llamadas),
# insuficiente para vaciar el cupo diario de MDBList con la key ajena.
limit_req_zone $binary_remote_addr zone=emby_api_zone:10m rate=2r/s;

# --- Sesión de Emby reflejada en una cookie (para auth_request) ------------
# La web de Emby manda su token de acceso en el header X-Emby-Token en
# CADA llamada a /emby/..., pero los fetch de los addons hacia /api-proxy/
# no llevan nada. Este map arma un Set-Cookie con ese mismo token, acotado
# a Path=/api-proxy/, HttpOnly (ningún JS lo lee), Secure y SameSite=Strict
# (otro sitio no puede hacer que el navegador lo mande). El server {} de
# Emby lo emite con 'add_header Set-Cookie $emby_session_cookie;' (vacío =
# nginx no manda el header). add_header sin 'always' solo aplica a
# respuestas 2xx/3xx, así un token rechazado por Emby (401) no genera
# cookie. Después, /api-proxy/* valida esa cookie contra Emby con
# auth_request (ver snippets/emby-api-proxy.conf, location /_emby_auth).
map $http_x_emby_token $emby_session_cookie {
    default "";
    "~^[0-9a-f]{32}$" "emby_proxy_token=$http_x_emby_token; Path=/api-proxy/; Secure; HttpOnly; SameSite=Strict; Max-Age=2592000";
}

# Keys reales, fuera de este archivo y con permisos 600.
include /etc/nginx/snippets/emby-api-keys.conf;
