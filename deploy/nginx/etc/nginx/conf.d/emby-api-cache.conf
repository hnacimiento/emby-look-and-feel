# ============================================================
# API proxy for the Emby addons -- HTTP context part.
# Goes in /etc/nginx/conf.d/emby-api-cache.conf (conf.d/*.conf is included
# inside http {} from nginx.conf, so there is NO need to touch nginx.conf).
#
# Defines what can only live in http context: the dedicated cache zone,
# the maps that strip the key from the query string, the map of allowed
# Referer/Origin and the limit_req zone. The locations live in
# snippets/emby-api-proxy.conf (server context); the real keys in
# snippets/emby-api-keys.conf (chmod 600, see emby-api-keys.conf.example).
# ============================================================

# Dedicated cache (do not mix with Emby's ram_cache/disk_cache): small
# JSON responses, many entries, long life. inactive=30d: an entry that
# nobody requests for 30 days is dropped even if its TTL was smaller.
proxy_cache_path /var/cache/nginx/emby_api levels=1:2 keys_zone=emby_api_cache:16m
                 max_size=512m inactive=30d use_temp_path=off;

# The addons still send '?api_key=<placeholder>' (TMDB) or
# '?apikey=<placeholder>' (MDBList) because their code is not touched; here
# that parameter is removed from the query string and the location adds the
# real key. Cases: only the key -> ""; 'a=1&api_key=x' -> 'a=1'; 'api_key=x&a=1' -> '&a=1'
# (the leftover leading '&' is harmless in a query string).
map $args $emby_api_args_nokey {
    default $args;
    "~^(?<pre>.*?)(?:^|&)(?:api_key|apikey)=[^&]*(?<post>.*)$" "$pre$post";
}

# Only requests coming from the Emby web are served. Nothing hardcoded
# from the vhost: "same origin" is derived from the server {} itself that
# receives the request ($scheme://$host, i.e. the server_name of
# emby.conf -- if the domain changes, this keeps working on its own), and
# direct LAN access is allowed for any http origin in private RFC1918
# ranges (the upstream IP:port from emby.conf falls in there without repeating it).
#
# How it works: the map key is "request-origin|vhost-origin"
# and the PCRE backreference \1 requires them to be identical. Referer
# arrives complete on same-origin and only as origin on cross-origin (due
# to the vhost's Referrer-Policy); Origin only arrives on cross-origin.
#
# It is a barrier against casual use of the proxy as a "free API with your
# key", not strong authentication (both headers are forgeable): the real
# protection is the limit_req below and the fixed destination of each
# location.
map "$http_referer|$scheme://$host" $emby_api_referer_ok {
    default 0;
    "~^(https?://[^/|]+)(/[^|]*)?\|\1$" 1;
}
map "$http_origin|$scheme://$host" $emby_api_origin_ok {
    default 0;
    "~^(https?://[^/|]+)\|\1$" 1;
}
map "$http_origin|$http_referer" $emby_api_lan_ok {
    default 0;
    "~^http://(10\.|172\.(1[6-9]|2[0-9]|3[01])\.|192\.168\.)[0-9.]+(:[0-9]+)?(/|\||$)" 1;
    "~^[^|]*\|http://(10\.|172\.(1[6-9]|2[0-9]|3[01])\.|192\.168\.)[0-9.]+(:[0-9]+)?/" 1;
}
map "$emby_api_referer_ok$emby_api_origin_ok$emby_api_lan_ok" $emby_api_client_ok {
    default 1;
    "000"   0;
}

# Per client IP: enough to browse (each title = 2-4 calls), not enough to
# drain the daily MDBList quota with someone else's key.
limit_req_zone $binary_remote_addr zone=emby_api_zone:10m rate=2r/s;

# --- Emby session reflected into a cookie (for auth_request) ------------
# The Emby web sends its access token in the X-Emby-Token header on
# EVERY call to /emby/..., but the addon fetches to /api-proxy/ carry
# nothing. This map builds a Set-Cookie with that same token, scoped
# to Path=/api-proxy/, HttpOnly (no JS reads it), Secure and SameSite=Strict
# (another site cannot make the browser send it). Emby's server {} emits
# it with 'add_header Set-Cookie $emby_session_cookie;' (empty =
# nginx does not send the header). add_header without 'always' only applies to
# 2xx/3xx responses, so a token rejected by Emby (401) does not generate a
# cookie. Afterwards, /api-proxy/* validates that cookie against Emby with
# auth_request (see snippets/emby-api-proxy.conf, location /_emby_auth).
map $http_x_emby_token $emby_session_cookie {
    default "";
    "~^[0-9a-f]{32}$" "emby_proxy_token=$http_x_emby_token; Path=/api-proxy/; Secure; HttpOnly; SameSite=Strict; Max-Age=2592000";
}

# Real keys, outside this file and with 600 permissions.
include /etc/nginx/snippets/emby-api-keys.conf;
