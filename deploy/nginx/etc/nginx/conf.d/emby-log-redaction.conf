# conf.d/emby-log-redaction.conf  (http context)
#
# Redacts the Emby session token in the access logs. Current Emby clients
# send the token as a URL parameter (X-Emby-Token=<32-hex>), not only as a
# header, so without this it ends up in plaintext on disk. See
# docs/SECURITY-LAYERS.md (layer 13) of the emby-look-and-feel project.
#
# Design: nginx.conf is NOT touched. This map chains onto $args_safe (which
# already redacts api_key= and is defined in nginx.conf) and produces $emby_args_safe
# with both api_key= AND X-Emby-Token= redacted. Emby's log_format
# (emby_timing / emby_cache, in conf.d/emby-tuning.conf) use $emby_args_safe.
#
# fail2ban strips the timestamp before the failregex; this is logging, it does
# not affect that analysis. It only redacts the token value; the rest of the query stays the same.
map $args_safe $emby_args_safe {
    default                                                 $args_safe;
    "~*^(?<pre>.*(?:^|&))X-Emby-Token=[^&]*(?<post>.*)$"    "${pre}X-Emby-Token=REDACTED${post}";
}

# Pseudonymization (traceability without a credential): $emby_token_id =
# HMAC-SHA256(secret, token) -> 16 hex, stable per session, not reversible.
# Requires the njs module (loaded in main.d/njs.conf) and the secret in
# /etc/nginx/secrets/emby-token-hmac.key (chmod 600). Emby's log_format
# add `token_id=$emby_token_id` (and `request_id=$request_id`, native to
# nginx). The real token stays redacted from the URL by the map above.
js_path "/etc/nginx/njs/";
js_import emby_log from emby-log.js;
js_set $emby_token_id emby_log.tokenId;
