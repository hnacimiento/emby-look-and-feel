# main.d/njs.conf  (nginx MAIN context, loaded by
# `include /etc/nginx/main.d/*.conf;` in nginx.conf)
#
# Loads the dynamic njs module (already compiled in this build). `load_module`
# can ONLY go in the nginx main context -- that is why it cannot live in
# conf.d/ (which is inside http{}). It is isolated here so nginx.conf needs
# ONE single generic line (the main.d include) and never has to be touched again
# to load modules. njs is used by emby-log.js (token_id pseudonymization).
load_module /etc/nginx/modules/ngx_http_js_module.so;
